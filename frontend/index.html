<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Podium Sheet Metal Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
        .card { background: #fff; padding: 20px; max-width: 450px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .field { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066cc; color: #fff; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        #result { margin-top: 15px; padding: 12px; background: #eef7ee; border: 1px solid #c3e6cb; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sheet Metal Podium Tool</h2>
    
    <div class="field">
        <label>Podium Outer Length (mm):</label>
        <input type="number" id="length" value="600">
    </div>
    <div class="field">
        <label>Podium Outer Width (mm):</label>
        <input type="number" id="width" value="400">
    </div>
    <div class="field">
        <label>Podium Height (mm):</label>
        <input type="number" id="height" value="1000">
    </div>
    <div class="field">
        <label>Material Thickness (mm):</label>
        <input type="number" id="thickness" value="1.5" step="0.1">
    </div>
    <div class="field">
        <label>1st Bend - Wall Height (mm):</label>
        <input type="number" id="bend1" value="80">
    </div>
    <div class="field">
        <label>2nd Bend - Top Lip Width (mm):</label>
        <input type="number" id="bend2" value="30">
    </div>

    <button onclick="generateFiles()">Generate CAD & Blueprint</button>

    <div id="result">
        <strong>Required Blank Size:</strong> <span id="blank_size"></span><br><br>
        <a id="download_link" href="#" style="background:#28a745; color:#fff; padding:8px 12px; text-decoration:none; border-radius:4px; font-weight:bold; display:inline-block;" download>Download Package (.ZIP)</a>
    </div>
</div>

<script>
async function generateFiles() {
    const data = {
        length: parseFloat(document.getElementById('length').value),
        width: parseFloat(document.getElementById('width').value),
        height: parseFloat(document.getElementById('height').value),
        thickness: parseFloat(document.getElementById('thickness').value),
        bend1: parseFloat(document.getElementById('bend1').value),
        bend2: parseFloat(document.getElementById('bend2').value)
    };

    const res = await fetch('https://sheetmetal-tool.onrender.com/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    const result = await res.json();
    document.getElementById('blank_size').innerText = result.blank_size;
    document.getElementById('download_link').href = `https://sheetmetal-tool.onrender.com/api/download/${result.job_id}`;
    document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
