<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Sheet Metal Cabinet Generator</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
    #sidebar { width: 320px; padding: 20px; background: #1e293b; color: white; box-sizing: border-box; }
    #viewport { flex: 1; background: #0f172a; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #334155; color: white; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 20px; padding: 10px; background: #334155; border-radius: 4px; display: none; }
    #download-btn { display: block; text-align: center; margin-top: 10px; padding: 10px; background: #16a34a; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="sidebar">
    <h2>Cabinet Generator</h2>
    <div class="input-group">
      <label>Length (mm)</label>
      <input type="number" id="length" value="500">
    </div>
    <div class="input-group">
      <label>Width (mm)</label>
      <input type="number" id="width" value="400">
    </div>
    <div class="input-group">
      <label>Height (mm)</label>
      <input type="number" id="height" value="300">
    </div>
    <div class="input-group">
      <label>Thickness (mm)</label>
      <input type="number" id="thickness" value="1.5" step="0.1">
    </div>
    <button onclick="generateFiles()">Generate Files</button>

    <div id="result">
      <p><strong>Required Sheet Size:</strong><br><span id="blank-size">-</span></p>
      <a id="download-btn" href="#" download>Download All Files (.ZIP)</a>
    </div>
  </div>

  <div id="viewport"></div>

  <script>
    // Set up 3D Viewport
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 15).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    let mesh;
    function update3D() {
      if (mesh) scene.remove(mesh);
      const l = parseFloat(document.getElementById('length').value) / 100;
      const w = parseFloat(document.getElementById('width').value) / 100;
      const h = parseFloat(document.getElementById('height').value) / 100;
      
      const geo = new THREE.BoxGeometry(l, h, w);
      const mat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
      mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
    }
    
    camera.position.set(8, 8, 8);
    camera.lookAt(0, 0, 0);
    update3D();

    function animate() {
      requestAnimationFrame(animate);
      if (mesh) mesh.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    // Send data to backend engine
    async function generateFiles() {
      update3D();
      const payload = {
        length: parseFloat(document.getElementById('length').value),
        width: parseFloat(document.getElementById('width').value),
        height: parseFloat(document.getElementById('height').value),
        thickness: parseFloat(document.getElementById('thickness').value)
      };

      // Change this URL to your deployed Render URL once hosted live
      const backendUrl = "http://localhost:8000";

      const response = await fetch(`${backendUrl}/api/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();

      document.getElementById('blank-size').innerText = data.blank_size;
      document.getElementById('download-btn').href = `${backendUrl}/api/download/${data.job_id}`;
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
