<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Metal Podium Engine</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .card { max-width: 500px; margin: auto; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; text-align: center; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sheet Metal Podium Engine</h2>
    <form id="cadForm">
        <label>Overall Length (L) [mm]:</label>
        <input type="number" id="length" value="300" required>

        <label>Overall Width (W) [mm]:</label>
        <input type="number" id="width" value="200" required>

        <label>Overall Height/Depth (H) [mm]:</label>
        <input type="number" id="height" value="150" required>

        <label>Sheet Thickness (t) [mm]:</label>
        <input type="number" step="0.1" id="thickness" value="2.0" required>

        <label>Flange 1 (F1 - Primary Bend) [mm]:</label>
        <input type="number" id="bend1" value="25" required>

        <label>Flange 2 (F2 - Return Lip) [mm]:</label>
        <input type="number" id="bend2" value="20" required>

        <button type="submit" id="submitBtn">Generate CAD & Blueprint</button>
    </form>

    <div class="result" id="resultBox">
        <p><strong>Calculated Flat Size:</strong> <span id="flatSizeText"></span></p>
        <a id="downloadBtn" class="dl-btn" href="#" target="_blank">Download Complete Package (.ZIP)</a>
    </div>
</div>

<script>
    const API_BASE = "https://sheetmetal-tool.onrender.com"; // Replace with your Render URL

    document.getElementById("cadForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.innerText = "Generating CAD & PDF...";
        btn.disabled = true;

        const payload = {
            length: parseFloat(document.getElementById("length").value),
            width: parseFloat(document.getElementById("width").value),
            height: parseFloat(document.getElementById("height").value),
            thickness: parseFloat(document.getElementById("thickness").value),
            bend1: parseFloat(document.getElementById("bend1").value),
            bend2: parseFloat(document.getElementById("bend2").value)
        };

        try {
            const res = await fetch(`${API_BASE}/api/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById("flatSizeText").innerText = data.blank_size;
                document.getElementById("downloadBtn").href = `${API_BASE}/api/download/${data.job_id}`;
                document.getElementById("resultBox").style.display = "block";
            } else {
                alert("Generation Error: " + data.detail);
            }
        } catch (err) {
            alert("Connection Error. Is backend running?");
        } finally {
            btn.innerText = "Generate CAD & Blueprint";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
